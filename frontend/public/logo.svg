<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nova</title>
  <desc id="desc">A luminous N-shaped API route with a nova spark.</desc>
  <defs>
    <linearGradient id="nova-bg" x1="84" y1="46" x2="430" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18314A"/>
      <stop offset=".5" stop-color="#0A1B2D"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="nova-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(377 111) rotate(132) scale(312 300)">
      <stop stop-color="#31E7D0" stop-opacity=".28"/>
      <stop offset=".48" stop-color="#3C9CFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#3C9CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nova-route" x1="134" y1="361" x2="383" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74F4B8"/>
      <stop offset=".46" stop-color="#27DBD5"/>
      <stop offset="1" stop-color="#56A1FF"/>
    </linearGradient>
    <linearGradient id="nova-shine" x1="182" y1="138" x2="328" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="nova-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#020817" flood-opacity=".54"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2DE3DB" flood-opacity=".2"/>
    </filter>
    <filter id="nova-spark-glow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#nova-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#nova-glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="116.5" fill="none" stroke="#C8F8FF" stroke-opacity=".16" stroke-width="3"/>
  <path d="M90 121C154 48 306 31 414 79" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="16" stroke-linecap="round"/>

  <g filter="url(#nova-shadow)">
    <path d="M150 348V181c0-21 26-31 40-15l132 158c14 17 40 7 40-15V164" fill="none" stroke="#061424" stroke-opacity=".72" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 348V181c0-21 26-31 40-15l132 158c14 17 40 7 40-15V164" fill="none" stroke="url(#nova-route)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M158 333V190c0-10 12-15 19-7l132 157" fill="none" stroke="url(#nova-shine)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <circle cx="150" cy="348" r="12" fill="#D9FFE9"/>
  <circle cx="362" cy="164" r="12" fill="#E5F4FF"/>
  <circle cx="255" cy="245" r="7" fill="#FFFFFF" fill-opacity=".78"/>

  <g transform="translate(387 113)" fill="#DFFFFA" filter="url(#nova-spark-glow)">
    <path d="M0-31C4-10 10-4 31 0 10 4 4 10 0 31-4 10-10 4-31 0-10-4-4-10 0-31Z"/>
    <circle cx="-27" cy="-24" r="4" fill="#75F5C2"/>
  </g>
</svg>
