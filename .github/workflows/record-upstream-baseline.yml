name: 记录上游成功基线

on:
  workflow_run:
    workflows:
      - 发布 GHCR 镜像
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "要记录的已合并同步 PR 编号"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nova-record-upstream-baseline
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_BRANCH: main
  SYNC_STATE: state/upstreams.json

jobs:
  prepare:
    name: 生成成功基线 PR
    # 默认暂停；将仓库变量 NOVA_UPSTREAM_AUTOMATION_ENABLED 设为 true 后启用。
    if: ${{ vars.NOVA_UPSTREAM_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出 Nova 主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 解析已合并同步 PR
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_PR: ${{ inputs.pull_request || '' }}
          PUBLISH_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          pr_number="$REQUESTED_PR"
          if [[ -z "$pr_number" && -n "$PUBLISH_HEAD_SHA" ]]; then
            merged_sync_prs="$(gh pr list \
              --repo "$repository" \
              --base main \
              --state merged \
              --label upstream-sync \
              --limit 100 \
              --json number,mergeCommit)"
            pr_number="$(jq -r --arg sha "$PUBLISH_HEAD_SHA" \
              '[.[] | select(.mergeCommit.oid == $sha)][0].number // empty' \
              <<< "$merged_sync_prs")"
          fi
          if [[ -z "$pr_number" ]]; then
            echo "没有找到已成功发布对应的同步 PR，跳过成功基线记录。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/$repository/pulls/$pr_number")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          merged="$(jq -r '.merged' <<< "$pr_json")"
          merge_commit="$(jq -r '.merge_commit_sha // empty' <<< "$pr_json")"
          merged_at="$(jq -r '.merged_at // empty' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha // empty' <<< "$pr_json")"
          labels="$(jq -r '[.labels[].name] | .[]' <<< "$pr_json")"
          if [[ "$base_ref" != main || "$head_repo" != "$repository" || "$head_ref" != sync/upstream-* || "$merged" != true ]]; then
            echo "不是已合并的本仓库上游同步 PR，跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx 'upstream-sync' <<< "$labels"; then
            echo "已合并 PR 缺少 upstream-sync 标签，跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$merge_commit" || -z "$head_sha" || -z "$base_sha" ]]; then
            echo "已合并 PR 缺少源提交、基线提交或合并提交，停止。" >&2
            exit 1
          fi
          provenance_json="$(gh api \
            "repos/$repository/contents/.nova-upstream-provenance.json?ref=$head_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode)"
          test "$(jq -r '.schema // empty' <<< "$provenance_json")" = 1
          test "$(jq -r '.generator // empty' <<< "$provenance_json")" = scripts/sync_upstream.py
          test "$(jq -r '.upstreamRepository // empty' <<< "$provenance_json")" = "$UPSTREAM_REPOSITORY"
          test "$(jq -r '.targetRef // empty' <<< "$provenance_json")" = main
          test "$(jq -r '.baseNovaCommit // empty' <<< "$provenance_json")" = "$base_sha"
          provenance_old="$(jq -r '.oldUpstreamCommit // empty' <<< "$provenance_json")"
          provenance_new="$(jq -r '.newUpstreamCommit // empty' <<< "$provenance_json")"
          [[ "$provenance_old" =~ ^[0-9a-f]{40}$ ]]
          [[ "$provenance_new" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$provenance_json" > "$RUNNER_TEMP/nova-provenance.json"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          candidate_ref="refs/remotes/origin/nova-candidate-$pr_number"
          if ! git fetch --no-tags --quiet origin "refs/pull/$pr_number/head:$candidate_ref"; then
            git fetch --no-tags --quiet origin "refs/heads/$head_ref:$candidate_ref"
          fi
          test "$(git rev-parse "$candidate_ref")" = "$head_sha"
          git fetch --no-tags --quiet upstream "$UPSTREAM_BRANCH"
          python3 scripts/verify_upstream_candidate.py \
            --root "$GITHUB_WORKSPACE" \
            --provenance "$RUNNER_TEMP/nova-provenance.json" \
            --base-sha "$base_sha" \
            --candidate-branch "$head_ref" \
            --candidate-sha "$head_sha" > "$RUNNER_TEMP/nova-candidate-evidence.json"
          upstream_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/commits/$provenance_new")"
          test "$(jq -r '.sha // empty' <<< "$upstream_json")" = "$provenance_new"
          upstream_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/contents/backend/cmd/server/VERSION?ref=$provenance_new" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n')"
          if [[ -z "$upstream_version" ]]; then
            echo "无法读取上游提交的服务版本：$provenance_new" >&2
            exit 1
          fi

          current_sha="$(jq -r '.lastSuccessfulCommit // empty' "$SYNC_STATE")"
          if [[ "$current_sha" == "$provenance_new" ]]; then
            echo "成功基线已经记录为 $provenance_new，幂等跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "merge_commit=$merge_commit" >> "$GITHUB_OUTPUT"
          echo "merged_at=$merged_at" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$provenance_new" >> "$GITHUB_OUTPUT"
          echo "upstream_old_sha=$provenance_old" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: 生成成功基线状态
        if: steps.source.outputs.eligible == 'true'
        env:
          UPSTREAM_OLD_SHA: ${{ steps.source.outputs.upstream_old_sha }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          UPSTREAM_VERSION: ${{ steps.source.outputs.upstream_version }}
          MERGE_COMMIT: ${{ steps.source.outputs.merge_commit }}
          MERGED_AT: ${{ steps.source.outputs.merged_at }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git switch main
          git reset --hard origin/main
          python3 scripts/record_upstream_success.py \
            --state "$SYNC_STATE" \
            --old-upstream-commit "$UPSTREAM_OLD_SHA" \
            --upstream-commit "$UPSTREAM_SHA" \
            --upstream-version "$UPSTREAM_VERSION" \
            --nova-commit "$MERGE_COMMIT" \
            --merged-at "$MERGED_AT"
          git diff --check
          git diff -- state/upstreams.json
          if git diff --quiet -- state/upstreams.json; then
            echo "状态文件没有变化，跳过基线 PR。"
            exit 0
          fi

      - name: 创建或更新基线分支
        if: steps.source.outputs.eligible == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/record-upstream-${UPSTREAM_SHA:0:12}"
          open_baseline_json="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --label upstream-baseline \
            --json number,headRefName,title,body)"
          existing="$(jq -r --arg sha "$UPSTREAM_SHA" \
            '[.[] | select((.title + " " + .body) | contains($sha))][0].number // empty' \
            <<< "$open_baseline_json")"
          if [[ -n "$existing" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$existing" >> "$GITHUB_OUTPUT"
            echo "branch=existing" >> "$GITHUB_OUTPUT"
            echo "已存在同一上游 SHA 的开放基线 PR #$existing，跳过重复创建。"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/upstreams.json
          git commit -m "配置：记录上游成功基线 ${UPSTREAM_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 确保基线标签存在
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh label create upstream-baseline --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "记录已验证的上游成功基线" || true

      - name: 创建基线 PR 并排队自动合并
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_BRANCH: ${{ steps.branch.outputs.branch }}
          EXISTING_PR: ${{ steps.branch.outputs.existing_pr || '' }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="${EXISTING_PR:-}"
          if [[ -z "$existing" ]]; then
            existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "${GITHUB_REPOSITORY_OWNER}:$BASELINE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$existing" ]]; then
            created_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BASELINE_BRANCH" \
              --title "配置：记录上游成功基线 ${UPSTREAM_SHA:0:12}" \
              --body "此 PR 由已通过 Nova 验证并合并的上游同步 PR 自动生成，只更新 state/upstreams.json。\n\n上游完整提交：${UPSTREAM_SHA}" \
              --label upstream-baseline)"
            existing="${created_url##*/}"
            [[ "$existing" =~ ^[0-9]+$ ]] || {
              echo "无法从 gh pr create 输出解析 PR 编号：$created_url" >&2
              exit 1
            }
          fi
          gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --auto --squash

  report-publish-failure:
    name: 记录 GHCR 发布失败
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 创建或复用发布失败 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISH_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          title="发布 GHCR 失败 ${PUBLISH_HEAD_SHA:0:12}"
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "已存在发布失败 Issue #$existing。"
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "GHCR 发布工作流失败。\n\n提交：$PUBLISH_HEAD_SHA\n运行记录：$PUBLISH_RUN_URL\n\n成功基线未推进，请修复发布问题后重新运行发布工作流。"
