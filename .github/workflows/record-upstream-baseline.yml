name: 记录上游成功基线

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "要记录的已合并同步 PR 编号"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nova-record-upstream-baseline
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_BRANCH: main
  SYNC_STATE: state/upstreams.json

jobs:
  prepare:
    name: 生成成功基线 PR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出 Nova 主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 解析已合并同步 PR
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_PR: ${{ inputs.pull_request || github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          pr_number="$REQUESTED_PR"
          if [[ -z "$pr_number" ]]; then
            echo "没有指定同步 PR，跳过成功基线记录。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/$repository/pulls/$pr_number")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          merged="$(jq -r '.merged' <<< "$pr_json")"
          merge_commit="$(jq -r '.merge_commit_sha // empty' <<< "$pr_json")"
          merged_at="$(jq -r '.merged_at // empty' <<< "$pr_json")"
          labels="$(jq -r '[.labels[].name] | .[]' <<< "$pr_json")"
          if [[ "$base_ref" != main || "$head_repo" != "$repository" || "$head_ref" != sync/upstream-* || "$merged" != true ]]; then
            echo "不是已合并的本仓库上游同步 PR，跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx 'upstream-sync' <<< "$labels"; then
            echo "已合并 PR 缺少 upstream-sync 标签，跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$merge_commit" || -z "$head_sha" ]]; then
            echo "已合并 PR 缺少源提交或合并提交，停止。" >&2
            exit 1
          fi
          if [[ "$head_ref" =~ ^sync/upstream-([0-9a-f]{7,40})-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            upstream_hint="${BASH_REMATCH[1]}"
          else
            echo "同步 PR 分支名没有包含可验证的上游提交：$head_ref" >&2
            exit 1
          fi

          upstream_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/commits/$upstream_hint")"
          upstream_sha="$(jq -r '.sha // empty' <<< "$upstream_json")"
          if [[ -z "$upstream_sha" ]]; then
            echo "无法从上游仓库解析完整提交：$upstream_hint" >&2
            exit 1
          fi
          upstream_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/contents/backend/cmd/server/VERSION?ref=$upstream_sha" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n')"
          if [[ -z "$upstream_version" ]]; then
            echo "无法读取上游提交的服务版本：$upstream_sha" >&2
            exit 1
          fi

          current_sha="$(jq -r '.lastSuccessfulCommit // empty' "$SYNC_STATE")"
          if [[ "$current_sha" == "$upstream_sha" ]]; then
            echo "成功基线已经记录为 $upstream_sha，幂等跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "merge_commit=$merge_commit" >> "$GITHUB_OUTPUT"
          echo "merged_at=$merged_at" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: 生成成功基线状态
        if: steps.source.outputs.eligible == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          UPSTREAM_VERSION: ${{ steps.source.outputs.upstream_version }}
          MERGE_COMMIT: ${{ steps.source.outputs.merge_commit }}
          MERGED_AT: ${{ steps.source.outputs.merged_at }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/record_upstream_success.py \
            --state "$SYNC_STATE" \
            --upstream-commit "$UPSTREAM_SHA" \
            --upstream-version "$UPSTREAM_VERSION" \
            --nova-commit "$MERGE_COMMIT" \
            --merged-at "$MERGED_AT"
          git diff --check
          git diff -- state/upstreams.json
          if git diff --quiet -- state/upstreams.json; then
            echo "状态文件没有变化，跳过基线 PR。"
            exit 0
          fi

      - name: 创建或更新基线分支
        if: steps.source.outputs.eligible == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/record-upstream-${UPSTREAM_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/upstreams.json
          git commit -m "配置：记录上游成功基线 ${UPSTREAM_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 确保基线标签存在
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh label create upstream-baseline --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "记录已验证的上游成功基线" || true

      - name: 创建基线 PR 并排队自动合并
        if: steps.source.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_BRANCH: ${{ steps.branch.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "${GITHUB_REPOSITORY_OWNER}:$BASELINE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            created_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BASELINE_BRANCH" \
              --title "配置：记录上游成功基线 ${UPSTREAM_SHA:0:12}" \
              --body "此 PR 由已通过 Nova 验证并合并的上游同步 PR 自动生成，只更新 state/upstreams.json。" \
              --label upstream-baseline)"
            existing="${created_url##*/}"
            [[ "$existing" =~ ^[0-9]+$ ]] || {
              echo "无法从 gh pr create 输出解析 PR 编号：$created_url" >&2
              exit 1
            }
          fi
          gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --auto --squash
