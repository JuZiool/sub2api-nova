name: 上游自动同步候选

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）检查一次上游更新，无更新时正常结束
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: "可选：指定上游提交 SHA，留空则使用 upstream/main"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nova-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api
  UPSTREAM_BRANCH: main
  SYNC_STATE: state/upstreams.json
  CUSTOMIZATION_MANIFEST: state/nova-customizations.json

jobs:
  create-candidate:
    name: 创建上游同步候选
    # 默认暂停；将仓库变量 NOVA_UPSTREAM_AUTOMATION_ENABLED 设为 true 后启用。
    if: ${{ vars.NOVA_UPSTREAM_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出 Nova 主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 配置 Git 远程
        shell: bash
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi
          git fetch --prune origin main
          git fetch --prune upstream "${UPSTREAM_BRANCH}"
          git switch main
          git reset --hard origin/main

      - name: 检查是否已有同一候选 PR
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_COMMIT: ${{ inputs.upstream_commit || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            upstream_sha="$(git rev-parse --verify "${REQUESTED_COMMIT}^{commit}")"
          else
            upstream_sha="$(git rev-parse --verify "upstream/${UPSTREAM_BRANCH}^{commit}")"
          fi
          open_sync_prs_json="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --label upstream-sync \
            --json number,headRefName)"
          open_sync_prs="$(jq -r --arg prefix "sync/upstream-${upstream_sha:0:12}-" \
            '[.[] | select(.headRefName | startswith($prefix))][0].number // empty' \
            <<< "$open_sync_prs_json")"
          if [[ -n "$open_sync_prs" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pr=$open_sync_prs" >> "$GITHUB_OUTPUT"
            echo "branch=existing" >> "$GITHUB_OUTPUT"
            echo "已存在同一上游提交的开放同步 PR #$open_sync_prs，跳过重复候选。"
            exit 0
          fi
          branch_base="sync/upstream-${upstream_sha:0:12}-$(date -u +%F)"
          branch="$branch_base"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: 运行同步候选脚本
        if: steps.existing.outputs.found != 'true'
        id: sync
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.upstream_commit || '' }}
          CANDIDATE_BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nova-upstream-sync-report.md"
          result="$RUNNER_TEMP/nova-upstream-sync-result.json"
          args=(
            --state "$SYNC_STATE"
            --manifest "$CUSTOMIZATION_MANIFEST"
            --report "$report"
            --branch "$CANDIDATE_BRANCH"
          )
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            args+=(--commit "$REQUESTED_COMMIT")
          fi
          set +e
          python3 scripts/sync_upstream.py "${args[@]}" > "$result"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]] && grep -q '^没有上游更新：' "$result"; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "没有新的上游提交。"
            exit 0
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "同步候选被阻止，退出码：$rc"
            if [[ -f "$report" ]]; then
              cat "$report"
            fi
            exit "$rc"
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          cat "$result"

      - name: 上传同步报告
        if: always() && steps.existing.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-upstream-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/nova-upstream-sync-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: 配置同步分支提交
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "同步脚本没有生成文件变更。" >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步：生成上游候选 ${CANDIDATE_BRANCH#sync/upstream-}"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: 生成同步 PR 内容
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        env:
          RESULT_FILE: ${{ steps.sync.outputs.result }}
          REPORT_FILE: ${{ steps.sync.outputs.report }}
          CANDIDATE_BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          preserved="$(python3 -c 'import json, os; print("\n".join(json.load(open(os.environ["RESULT_FILE"], encoding="utf-8")).get("preservedProtectedPaths", [])))')"
          applied="$(python3 -c 'import json, os; print("\n".join(json.load(open(os.environ["RESULT_FILE"], encoding="utf-8")).get("appliedPaths", [])))')"
          {
            echo "本 PR 由上游同步工作流生成，目标分支为 main。"
            echo
            echo "同步脚本只生成候选，不更新 lastSuccessfulCommit；成功基线须在本 PR 验证并合并后单独更新。"
            echo
            echo "候选分支：$CANDIDATE_BRANCH"
            if [[ -n "$preserved" ]]; then
              echo
              echo "本次上游变更命中保护路径，已自动保留当前 Nova 代码："
              printf '%s\n' "$preserved" | sed 's/^/- `/' | sed 's/$/`/'
            fi
            if [[ -n "$applied" ]]; then
              echo
              echo "本次实际应用的普通路径："
              printf '%s\n' "$applied" | sed 's/^/- `/' | sed 's/$/`/'
            fi
            echo
            cat "$REPORT_FILE"
          } > "$RUNNER_TEMP/nova-upstream-pr-body.md"

      - name: 确保同步标签存在
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color 1d76db --description "由上游同步工作流生成" || true

      - name: 创建或更新同步 PR
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.existing.outputs.branch }}
          RESULT_FILE: ${{ steps.sync.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          labels=(upstream-sync)
          label_args=()
          for label in "${labels[@]}"; do
            label_args+=(--label "$label")
          done
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "同步：上游候选 ${CANDIDATE_BRANCH#sync/upstream-}" \
            --body-file "$RUNNER_TEMP/nova-upstream-pr-body.md" \
            "${label_args[@]}"
