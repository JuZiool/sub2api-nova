name: 上游同步自动合并

on:
  workflow_run:
    workflows:
      - Nova PR validation
      - 静态检查与脚本回归
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nova-upstream-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  queue-auto-merge:
    name: 检查并排队上游同步自动合并
    # 默认暂停；将仓库变量 NOVA_UPSTREAM_AUTOMATION_ENABLED 设为 true 后启用。
    if: ${{ vars.NOVA_UPSTREAM_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出待合并候选用于证据校验
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 校验同步 PR 安全条件
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          if [[ "$RUN_EVENT" != pull_request && "$RUN_EVENT" != merge_group ]]; then
            echo "验证运行事件为 $RUN_EVENT，没有可自动合并的 Pull Request，跳过。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/$repository/commits/$RUN_HEAD_SHA/pulls")"
          pr_number="$(jq -r --arg run_sha "$RUN_HEAD_SHA" '[.[] | select(.base.ref == "main" and .state == "open" and .head.sha == $run_sha)][0].number // empty' <<< "$pr_json")"
          if [[ -z "$pr_number" ]]; then
            echo "当前验证提交没有关联可自动合并的开放 Pull Request，跳过自动合并。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/$repository/pulls/$pr_number")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha // empty' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          mergeable="$(jq -r '.mergeable' <<< "$pr_json")"
          labels="$(jq -r '[.labels[].name] | .[]' <<< "$pr_json")"

          if [[ "$base_ref" != main || "$head_repo" != "$repository" || "$head_ref" != sync/upstream-* ]]; then
            echo "不是本仓库的上游同步 PR，跳过自动合并。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$head_sha" != "$RUN_HEAD_SHA" ]]; then
            echo "验证运行提交与 PR 当前提交不一致，跳过自动合并。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx 'upstream-sync' <<< "$labels"; then
            echo "PR 缺少 upstream-sync 标签，跳过自动合并。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(nova-critical-change|nova-manual-review|no-auto-merge)$' <<< "$labels"; then
            echo "同步 PR 命中人工阻止标签，跳过自动合并。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          provenance_json="$(gh api \
            "repos/$repository/contents/.nova-upstream-provenance.json?ref=$head_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode)"
          test -n "$provenance_json"
          test "$(jq -r '.schema // empty' <<< "$provenance_json")" = 1
          test "$(jq -r '.generator // empty' <<< "$provenance_json")" = scripts/sync_upstream.py
          test "$(jq -r '.upstreamRepository // empty' <<< "$provenance_json")" = Wei-Shaw/sub2api
          test "$(jq -r '.upstreamRef // empty' <<< "$provenance_json")" = main
          test "$(jq -r '.targetRef // empty' <<< "$provenance_json")" = main
          test "$(jq -r '.baseNovaCommit // empty' <<< "$provenance_json")" = "$base_sha"
          test "$(jq -r '.candidateBranch // empty' <<< "$provenance_json")" = "$head_ref"
          provenance_new="$(jq -r '.newUpstreamCommit // empty' <<< "$provenance_json")"
          provenance_old="$(jq -r '.oldUpstreamCommit // empty' <<< "$provenance_json")"
          [[ "$provenance_new" =~ ^[0-9a-f]{40}$ ]]
          [[ "$provenance_old" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.manifestPath // empty' <<< "$provenance_json")" = state/nova-customizations.json
          printf '%s\n' "$provenance_json" > "$RUNNER_TEMP/nova-provenance.json"
          upstream_new_json="$(gh api "repos/Wei-Shaw/sub2api/commits/$provenance_new")"
          upstream_old_json="$(gh api "repos/Wei-Shaw/sub2api/commits/$provenance_old")"
          test "$(jq -r '.sha // empty' <<< "$upstream_new_json")" = "$provenance_new"
          test "$(jq -r '.sha // empty' <<< "$upstream_old_json")" = "$provenance_old"

          candidate_manifest_sha="$(gh api \
            "repos/$repository/contents/state/nova-customizations.json?ref=$head_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode | sha256sum | awk '{print $1}')"
          trusted_manifest_sha="$(git show "$base_sha:state/nova-customizations.json" | sha256sum | awk '{print $1}')"
          test "$candidate_manifest_sha" = "$trusted_manifest_sha"
          test "$(jq -r '.manifestSha256 // empty' <<< "$provenance_json")" = "$trusted_manifest_sha"

          candidate_ref="refs/remotes/origin/nova-candidate-$pr_number"
          if ! git fetch --no-tags --quiet origin "refs/pull/$pr_number/head:$candidate_ref"; then
            git fetch --no-tags --quiet origin "refs/heads/$head_ref:$candidate_ref"
          fi
          test "$(git rev-parse "$candidate_ref")" = "$head_sha"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch --no-tags --quiet upstream main
          candidate_report="$(python3 scripts/verify_upstream_candidate.py \
            --root "$GITHUB_WORKSPACE" \
            --provenance "$RUNNER_TEMP/nova-provenance.json" \
            --base-sha "$base_sha" \
            --candidate-branch "$head_ref" \
            --candidate-sha "$head_sha")"
          critical_count="$(jq '.criticalPaths | length' <<< "$candidate_report")"
          manual_count="$(jq '.manualReviewPaths | length' <<< "$candidate_report")"
          stop_count="$(jq '.stopOnDeletePaths | length' <<< "$candidate_report")"
          if [[ "$critical_count" -gt 0 || "$manual_count" -gt 0 || "$stop_count" -gt 0 ]]; then
            echo "候选重新分类为人工复核，禁止自动合并。"
            echo "$candidate_report"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          checks_json="$(gh api "repos/$repository/commits/$head_sha/check-runs?per_page=100")"
          for required_check in "Validate fusion candidate" "Static checks and script regressions"; do
            latest_check="$(jq -r --arg name "$required_check" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.completed_at // .started_at // .created_at)
              | last
              | if . == null then "missing" else "\(.status):\(.conclusion // "")" end
            ' <<< "$checks_json")"
            test "$latest_check" = "completed:success"
          done

          compare_json="$(gh api "repos/$repository/compare/main...$head_sha")"
          test "$(jq -r '.status' <<< "$compare_json")" = ahead

          for attempt in {1..10}; do
            pr_json="$(gh api "repos/$repository/pulls/$pr_number")"
            mergeable="$(jq -r '.mergeable' <<< "$pr_json")"
            merge_state="$(jq -r '.mergeable_state' <<< "$pr_json")"
            if [[ "$mergeable" = true && "$merge_state" = clean ]]; then
              break
            fi
            if [[ "$mergeable" = false || "$merge_state" = blocked || "$merge_state" = dirty || "$merge_state" = behind ]]; then
              echo "PR 当前不可安全合并：mergeable=$mergeable mergeable_state=$merge_state" >&2
              exit 1
            fi
            sleep 3
          done
          test "$mergeable" = true
          test "$merge_state" = clean

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "已通过自动合并安全门禁：PR #$pr_number，提交 $head_sha。"

      - name: 启用 GitHub 原生 Auto-merge
        if: steps.guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.guard.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash
